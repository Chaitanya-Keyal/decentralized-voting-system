packages:
  - apps/*
  - packages/*
  - contracts

# One version of these across every package.
catalog:
  "@types/node": ^22.0.0
  typescript: ~5.9.3
  viem: ^2.57.11
  vite: ^8.3.5
  vitest: ^5.0.5
  zod: ^4.6.7

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

peerDependencyRules:
  allowedVersions:
    # esbuild is an optional peer of Vite 8, which does not use it here. The 0.25 copy in the
    # tree is the one @wagmi/cli pins.
    vite>esbuild: ">=0.25"
