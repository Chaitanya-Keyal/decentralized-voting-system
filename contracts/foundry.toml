[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
# Cancun is the default target for solc 0.8.28 and is supported on Sepolia and Anvil.
# OpenZeppelin 5.x needs it for `mcopy`.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The deploy script records addresses in deployments/, and a test reads a fixture written by
# the TypeScript tree builder.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./test/fixtures" },
]

[profile.ci.fuzz]
runs = 1000

# For the gas snapshot: every top-level call runs as its own transaction.
[profile.gas]
isolate = true

[lint]
# Phases are time-gated by design, over windows of minutes to days. Since the Merge a block's
# timestamp is fixed by its slot; a proposer can at most skip its slot, delaying a phase change by
# one 12-second slot.
exclude_lints = ["block-timestamp"]

# forge fmt always indents with spaces.
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
