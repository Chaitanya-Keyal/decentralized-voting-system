<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · DVote</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #171717;
        --muted: #52525b;
        --border: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --foreground: #ededed;
          --muted: #a1a1aa;
          --border: #27272a;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.25rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="48" height="48" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#18181b" />
        <rect
          x="120"
          y="136"
          width="256"
          height="256"
          rx="44"
          fill="none"
          stroke="#fafafa"
          stroke-width="36"
        />
        <path
          d="M178 262 L240 324 L396 146"
          fill="none"
          stroke="#34d399"
          stroke-width="48"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h1>You're offline</h1>
      <p>
        DVote reads every election from the blockchain as you look at it, so it needs a connection.
        Your voting key is still saved in this browser.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
