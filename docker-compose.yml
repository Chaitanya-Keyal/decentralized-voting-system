# Local Postgres (registrar and indexer) and Redis (relayer queue), reachable from this
# machine only. Host ports are 5433 and 6380 so they don't clash with a locally installed
# Postgres or Redis on the default ports.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dvote
      POSTGRES_PASSWORD: dvote
      POSTGRES_DB: dvote
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  postgres-data:
