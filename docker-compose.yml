# Local Postgres (registrar and indexer), Redis (relayer queue), an IPFS node (voter lists and
# ballot metadata) and a mail catcher, reachable from this machine only. Postgres and Redis use
# host ports 5433 and 6380 so they don't clash with a locally installed Postgres or Redis.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dvote
      POSTGRES_PASSWORD: dvote
      POSTGRES_DB: dvote
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

  # 5001 is the node's RPC API, which can change its settings; 8080 is the read-only gateway the
  # browser downloads from.
  ipfs:
    image: ipfs/kubo:v0.43.1
    environment:
      IPFS_PROFILE: server
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    volumes:
      - ipfs-data:/data/ipfs

volumes:
  postgres-data:
  ipfs-data:
